global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert-rules.yaml

scrape_configs:
  - job_name: periapsis-api
    metrics_path: /metrics
    honor_labels: false
    static_configs:
      - targets: [api:8080]
  - job_name: periapsis-worker
    metrics_path: /metrics
    honor_labels: false
    static_configs:
      - targets: [worker:8082]
  - job_name: periapsis-notifier
    metrics_path: /metrics
    honor_labels: false
    static_configs:
      - targets: [notifier:8083]
  - job_name: otel-collector
    metrics_path: /metrics
    honor_labels: false
    static_configs:
      - targets: [otel-collector:8888, otel-collector:8889]
