  api_database_url:
    external: true
    name: ${PERIAPSIS_API_DATABASE_URL_SECRET:-periapsis_api_database_url_v1}
  worker_database_url:
    external: true
    name: ${PERIAPSIS_WORKER_DATABASE_URL_SECRET:-periapsis_worker_database_url_v1}
  notifier_database_url:
