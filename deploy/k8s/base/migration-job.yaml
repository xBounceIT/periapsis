apiVersion: batch/v1
kind: Job
metadata:
  name: periapsis-migration
  labels:
    app.kubernetes.io/name: periapsis-migration
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: periapsis-migration
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: periapsis-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: periapsis/database-task:development
          imagePullPolicy: IfNotPresent
          args:
            - migrate
          envFrom:
            - configMapRef:
                name: periapsis-runtime
          env:
            - name: PERIAPSIS_DATABASE_ADMIN_URL_FILE
              value: /run/secrets/database-admin-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: migration-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: migration-secrets
          secret:
            secretName: periapsis-runtime
            defaultMode: 288
            items:
              - key: database-admin-url
                path: database-admin-url
              - key: api-database-password
                path: api_database_password
              - key: worker-database-password
                path: worker_database_password
              - key: notifier-database-password
                path: notifier_database_password
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
