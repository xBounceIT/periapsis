apiVersion: apps/v1
kind: Deployment
metadata:
  name: periapsis-notifier
  labels:
    app.kubernetes.io/name: periapsis-notifier
    app.kubernetes.io/component: notifier
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: periapsis-notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: periapsis-notifier
        app.kubernetes.io/component: notifier
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8083"
    spec:
      serviceAccountName: periapsis-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: periapsis-notifier
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: periapsis-notifier
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: periapsis-notifier
      containers:
        - name: notifier
          image: periapsis/notifier:development
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: periapsis-runtime
          env:
            - name: NOTIFICATION_KEYRING_FILE
              value: /run/notification-secrets/notification-keyring
            - name: OTEL_SERVICE_NAME
              value: periapsis-notifier
            - name: PERIAPSIS_DATABASE_URL_FILE
              value: /run/secrets/notifier-database-url
            - name: PERIAPSIS_NOTIFIER_FANOUT_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: PERIAPSIS_NOTIFIER_PREVIEW_TOKEN_FILE
              value: /run/secrets/notifier-preview-token
            - name: PERIAPSIS_NOTIFIER_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: notification-keyring
              mountPath: /run/notification-secrets
              readOnly: true
            - name: runtime-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: notification-keyring
          secret:
            secretName: periapsis-notification-keyring
            defaultMode: 288
            items:
              - key: notification-keyring
                path: notification-keyring
        - name: runtime-secrets
          secret:
            secretName: periapsis-runtime
            defaultMode: 288
            items:
              - key: notifier-database-url
                path: notifier-database-url
              - key: notifier-preview-token
                path: notifier-preview-token
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
