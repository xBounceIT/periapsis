apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: periapsis-runtime
  namespace: periapsis
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secrets
  target:
    name: periapsis-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-database-url
      remoteRef:
        key: periapsis/production/api-database-url
    - secretKey: worker-database-url
      remoteRef:
        key: periapsis/production/worker-database-url
    - secretKey: notifier-database-url
      remoteRef:
        key: periapsis/production/notifier-database-url
    - secretKey: notifier-database-password
      remoteRef:
        key: periapsis/production/notifier-database-password
    - secretKey: notifier-preview-token
      remoteRef:
        key: periapsis/production/notifier-preview-token
    - secretKey: database-admin-url
      remoteRef:
        key: periapsis/production/database-admin-url
    - secretKey: api-database-password
      remoteRef:
        key: periapsis/production/api-database-password
    - secretKey: worker-database-password
      remoteRef:
        key: periapsis/production/worker-database-password
    - secretKey: bootstrap-token
      remoteRef:
        key: periapsis/production/bootstrap-token
    - secretKey: master-key
      remoteRef:
        key: periapsis/production/master-key
    - secretKey: api-credential-keyring
      remoteRef:
        key: periapsis/production/api-credential-keyring
    - secretKey: identity-keyring
      remoteRef:
        key: periapsis/production/identity-keyring
    - secretKey: s3-access-key
      remoteRef:
        key: periapsis/production/s3-access-key
    - secretKey: s3-secret-key
      remoteRef:
        key: periapsis/production/s3-secret-key
    - secretKey: s3-ca-bundle
      remoteRef:
        key: periapsis/production/s3-ca-bundle
    - secretKey: federated-ca-bundle
      remoteRef:
        key: periapsis/production/federated-ca-bundle
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: periapsis-notification-keyring
  namespace: periapsis
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secrets
  target:
    name: periapsis-notification-keyring
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: notification-keyring
      remoteRef:
        key: periapsis/production/notification-keyring
