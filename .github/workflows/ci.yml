        run: pnpm --filter @periapsis/db test:security
      # The readiness lifecycle proof requires absent runtime logins and drops
      # its roles on completion. Run the Compose provisioning proof afterward.
      - name: Verify Compose runtime provisioning preserves the schema seal
        env:
          PERIAPSIS_COMPOSE_PROVISION_TEST_DATABASE_URL: postgresql://postgres:periapsis-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5433/periapsis?sslmode=disable
        run: node scripts/deploy/compose-runtime-provisioning.mjs
      - name: Prove tenant isolation and append-only audit
        run: docker exec -i "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U postgres -d periapsis_rls < tests/security/rls.sql
      - name: Exercise PostgreSQL API admission, authorization, and shared DFIR repositories
        env:
          PERIAPSIS_READINESS_TEST_DATABASE_URL: postgresql://postgres:periapsis-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/periapsis_go_authorization?sslmode=disable
          PERIAPSIS_IDENTITY_PROVIDER_TEST_DATABASE_URL: postgresql://postgres:periapsis-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/periapsis_go_authorization?sslmode=disable
          PERIAPSIS_API_RATE_LIMIT_TEST_DATABASE_URL: postgresql://postgres:periapsis-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/periapsis_api_rate_limit?sslmode=disable
          PERIAPSIS_AUTHORIZATION_TEST_DATABASE_URL: postgresql://postgres:periapsis-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/periapsis_go_authorization?sslmode=disable
          PERIAPSIS_DFIR_SHARED_ATTACHMENTS_TEST_DATABASE_URL: postgresql://postgres:periapsis-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/periapsis_go_dfir_shared?sslmode=disable
          PERIAPSIS_DFIR_SHARED_CONTENT_TEST_DATABASE_URL: postgresql://postgres:periapsis-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/periapsis_dfir_shared_content_ci?sslmode=disable
          PERIAPSIS_DFIR_SHARED_CONTENT_EXPECTED_DATA_DIRECTORY: ${{ steps.postgres_test_pin.outputs.data_directory }}
          PERIAPSIS_SESSION_LOGOUT_TEST_DATABASE_URL: postgresql://postgres:periapsis-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/periapsis_session_logout_ci?sslmode=disable
          PERIAPSIS_SESSION_LOGOUT_EXPECTED_DATA_DIRECTORY: ${{ steps.postgres_test_pin.outputs.data_directory }}
        run: go test -count=1 -run '^(TestIdentityProviderRepositoryAndServicePostgreSQL|TestRuntimeRepositoryReadinessPostgreSQL|TestAPIRateLimitRepositoryPostgreSQL|TestAuthorizationRepository.*|TestDFIRSharedAttachmentsStayPathBoundInPostgres|TestDFIRSharedContentReplacementsPostgreSQL|TestSessionLogoutRepositoryFreshConnectionPostgreSQL)$' ./services/api/internal/postgres ./services/worker/internal/postgres
      - name: Drop the committed repository test databases
        if: ${{ always() }}
        run: |
          set -euo pipefail
          for database in periapsis_dfir_shared_content_ci periapsis_session_logout_ci; do
            docker exec "${{ job.services.postgres.id }}" dropdb -U postgres --if-exists "${database}"
          done
          task_remaining="$(docker exec "${{ job.services.postgres.id }}" psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres -c "SELECT count(*) FROM pg_database WHERE datname IN ('periapsis_dfir_shared_content_ci','periapsis_session_logout_ci')")"
          [[ "$task_remaining" == "0" ]]
