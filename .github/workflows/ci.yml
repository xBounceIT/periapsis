name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  javascript:
    name: TypeScript, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Validate Compose database runner syntax
        run: |
          node --check deploy/compose/database-task.mjs
          node --check tests/integration/auth-smoke.mjs
          node --check tests/integration/ldap-auth-acceptance.mjs
          sh -n deploy/compose/auth/openldap-acceptance-fixture.sh
          bash -n deploy/compose/auth/openldap-bootstrap.sh
      - name: Transpile and enumerate the live browser acceptance
        run: pnpm test:e2e:live:list
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Validate operations and deployment source contracts
        run: pnpm test:operations
      - name: Install Playwright Chromium
        if: github.event_name != 'pull_request'
        run: pnpm --filter @periapsis/web exec playwright install --with-deps chromium
      - name: Exercise the browser acceptance flow
        if: github.event_name != 'pull_request'
        run: pnpm test:e2e
      - name: Build
        run: pnpm build

  smtp-mailpit-acceptance:
    if: github.event_name != 'pull_request'
    name: SMTP Mailpit acceptance
    needs: javascript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: periapsis_smtp_${{ github.run_id }}_${{ github.run_attempt }}
      PERIAPSIS_API_DATABASE_PASSWORD: unused-mailpit-acceptance
      # Mailpit consumes no secrets, but Compose still interpolates the full model.
      PERIAPSIS_COMPOSE_SECRETS_DIR: /unused-mailpit-secrets
      PERIAPSIS_DEV_TLS_CA_FILE: /dev/null
      PERIAPSIS_DEV_TLS_CERT_FILE: /dev/null
      PERIAPSIS_DEV_TLS_KEY_FILE: /dev/null
      PERIAPSIS_MAILPIT_ACCEPTANCE: "1"
      PERIAPSIS_MAILPIT_API_ORIGIN: http://127.0.0.1:18025
      PERIAPSIS_MAILPIT_PORT: "18025"
      PERIAPSIS_MAILPIT_SMTP_HOST: 127.0.0.1
      PERIAPSIS_MAILPIT_SMTP_PORT: "11025"
      PERIAPSIS_WORKER_DATABASE_PASSWORD: unused-mailpit-acceptance
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install notifier dependencies
        run: pnpm install --frozen-lockfile --filter @periapsis/notifier...
      - name: Start the full-profile SMTP fixture
        run: docker compose --file deploy/compose/compose.yaml --profile full up --detach --wait mailpit
      - name: Verify loopback SMTP and HTTP publication
        run: |
          set -euo pipefail
          smtp_binding=$(docker compose --file deploy/compose/compose.yaml --profile full port mailpit 1025)
          http_binding=$(docker compose --file deploy/compose/compose.yaml --profile full port mailpit 8025)
          test "$smtp_binding" = "127.0.0.1:${PERIAPSIS_MAILPIT_SMTP_PORT}"
          test "$http_binding" = "127.0.0.1:${PERIAPSIS_MAILPIT_PORT}"
      - name: Probe, deliver, and inspect the captured message
        run: pnpm --filter @periapsis/notifier test:mailpit
      - name: Stop the SMTP fixture
        if: always()
        run: docker compose --file deploy/compose/compose.yaml --profile full down --volumes --remove-orphans

  go:
    name: Go vet and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          check-latest: false
          cache-dependency-path: |
            modules/customfields/go.sum
            modules/dfir/go.sum
            services/api/go.sum
            modules/identity/go.sum
            modules/sla/go.sum
            modules/ticketing/go.sum
            services/worker/go.sum
      - name: Vet
        run: go vet ./modules/contacts/... ./modules/customfields/... ./modules/dfir/... ./modules/identity/... ./modules/sla/... ./modules/ticketing/... ./services/api/... ./services/worker/...
      - name: Vet shell-free healthcheck
        run: go vet ./deploy/compose/healthcheck.go
      - name: Test shell-free healthcheck budgets
        run: go test -count=1 ./deploy/compose/healthcheck.go ./deploy/compose/healthcheck_test.go
      - name: Test without the release race detector
        if: github.event_name == 'pull_request'
        run: go test -count=1 ./modules/contacts/... ./modules/customfields/... ./modules/dfir/... ./modules/identity/... ./modules/sla/... ./modules/ticketing/... ./services/api/... ./services/worker/...
      - name: Test with race detector
        if: github.event_name != 'pull_request'
        run: go test -race -count=1 ./modules/contacts/... ./modules/customfields/... ./modules/dfir/... ./modules/identity/... ./modules/sla/... ./modules/ticketing/... ./services/api/... ./services/worker/...

  generated:
    name: Generated and schema drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          check-latest: false
          cache-dependency-path: |
            modules/customfields/go.sum
            modules/dfir/go.sum
            services/api/go.sum
            modules/identity/go.sum
            modules/sla/go.sum
            modules/ticketing/go.sum
            services/worker/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify OpenAPI, clients, and migrations
        run: pnpm verify:generated
      - name: Verify permission catalog
        run: pnpm verify:permission-catalog
      - name: Verify canonical SLA seed documents and kernel behavior
        run: pnpm verify:sla-fixture
      - name: Verify generated Go contract and queries
        run: pnpm verify:go-generated

  supply-chain:
    if: github.event_name != 'pull_request'
    name: Source SBOM and security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: periapsis-source.spdx.json
          format: spdx-json
          output-file: periapsis-source.spdx.json
          path: .
          upload-release-assets: false
      - name: Scan dependencies, source secrets, and deployment configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          exit-code: "1"
          format: table
          ignore-unfixed: false
          scan-ref: .
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          version: v0.74.0

  containers:
    if: github.event_name != 'pull_request'
    name: Containers and Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: periapsis_ci_${{ github.run_id }}_${{ github.run_attempt }}
      PERIAPSIS_API_PORT: "18080"
      PERIAPSIS_IMAGE_REVISION: ${{ github.sha }}
      PERIAPSIS_IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
      PERIAPSIS_WEB_PORT: "18081"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0
          run_install: false
      - name: Install Node.js for integration drivers
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          check-latest: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install integration-driver dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @periapsis/web exec playwright install --with-deps chromium
      - name: Generate ephemeral integration credentials
        shell: bash
        run: |
          set -euo pipefail
          mask_secret() {
            local value="$1"
            [[ -n "${value}" && "${value}" != *$'\r'* && "${value}" != *$'\n'* ]] || return 1
            printf '::add-mask::%s\n' "${value//%/%25}"
          }
          publish_secret() {
            local name="$1"
            local value="$2"
            [[ "${name}" =~ ^PERIAPSIS_[A-Z0-9_]+$ ]] || return 1
            mask_secret "${value}" || return 1
            printf '%s=%s\n' "${name}" "${value}" >> "${GITHUB_ENV}"
          }
          printf '%s\n' '127.0.0.1 idp.localhost storage.localhost' | sudo tee -a /etc/hosts >/dev/null
          tls_directory="${RUNNER_TEMP}/periapsis-compose-tls"
          mkdir -p "${tls_directory}"
          openssl genrsa -out "${tls_directory}/ca.key" 2048
          openssl req -x509 -new -sha256 -days 1 \
            -key "${tls_directory}/ca.key" \
            -subj "/CN=Periapsis CI Compose CA" \
            -out "${tls_directory}/ca.crt"
          openssl genrsa -out "${tls_directory}/server.key" 2048
          openssl req -new -sha256 \
            -key "${tls_directory}/server.key" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,DNS:idp.localhost,DNS:storage.localhost,IP:127.0.0.1,IP:::1" \
            -out "${tls_directory}/server.csr"
          openssl x509 -req -sha256 -days 1 \
            -in "${tls_directory}/server.csr" \
            -CA "${tls_directory}/ca.crt" \
            -CAkey "${tls_directory}/ca.key" \
            -CAcreateserial \
            -copy_extensions copy \
            -out "${tls_directory}/server.crt"
          chmod 0444 "${tls_directory}/ca.crt" "${tls_directory}/server.crt"
          chmod 0400 "${tls_directory}/server.key"
          # Compose file secrets retain host ownership; only the non-root edge needs this key.
          sudo chown 10001:10001 "${tls_directory}/server.key"
          api_credential_root="$(openssl rand -base64 32 | tr -d '\n')"
          identity_root="$(openssl rand -base64 32 | tr -d '\n')"
          notification_root="$(openssl rand 32 | base64 -w0 | tr '+/' '-_' | tr -d '=')"
          # Mask components as well as their JSON envelopes, before any env publication.
          mask_secret "${api_credential_root}"
          mask_secret "${identity_root}"
          mask_secret "${notification_root}"
          publish_secret PERIAPSIS_API_DATABASE_PASSWORD "$(openssl rand -hex 32)"
          publish_secret PERIAPSIS_API_CREDENTIAL_KEYRING "{\"activeVersion\":1,\"keys\":[{\"version\":1,\"key\":\"${api_credential_root}\"}]}"
          publish_secret PERIAPSIS_BOOTSTRAP_TOKEN "$(openssl rand -hex 32)"
          publish_secret PERIAPSIS_IDENTITY_KEYRING "{\"activeVersion\":1,\"keys\":[{\"version\":1,\"key\":\"${identity_root}\"}]}"
          publish_secret PERIAPSIS_IDP_ADMIN_PASSWORD "$(openssl rand -base64 48 | tr -d '\n')"
          publish_secret PERIAPSIS_LDAP_ACCEPTANCE_CUSTOMER_PASSWORD "$(openssl rand -base64 48 | tr -d '\n')"
          publish_secret PERIAPSIS_LDAP_ACCEPTANCE_ISOLATION_PASSWORD "$(openssl rand -base64 48 | tr -d '\n')"
          publish_secret PERIAPSIS_LDAP_ACCEPTANCE_SECOND_USER_PASSWORD "$(openssl rand -base64 48 | tr -d '\n')"
          publish_secret PERIAPSIS_LDAP_ACCEPTANCE_USER_PASSWORD "$(openssl rand -base64 48 | tr -d '\n')"
          publish_secret PERIAPSIS_LDAP_ADMIN_PASSWORD "$(openssl rand -base64 48 | tr -d '\n')"
          publish_secret PERIAPSIS_MASTER_KEY "$(openssl rand -base64 32)"
          publish_secret PERIAPSIS_MINIO_ROOT_PASSWORD "$(openssl rand -hex 32)"
          publish_secret PERIAPSIS_MINIO_ROOT_USER "ciroot$(openssl rand -hex 8)"
          publish_secret PERIAPSIS_MINIO_KMS_SECRET_KEY "ci-export:$(openssl rand -base64 32)"
          publish_secret PERIAPSIS_NOTIFIER_DATABASE_PASSWORD "$(openssl rand -hex 32)"
          publish_secret PERIAPSIS_NOTIFIER_PREVIEW_TOKEN "$(openssl rand -hex 32)"
          publish_secret PERIAPSIS_NOTIFICATION_KEYRING "{\"activeVersion\":1,\"keys\":[{\"version\":1,\"key\":\"${notification_root}\"}]}"
          publish_secret PERIAPSIS_POSTGRES_PASSWORD "$(openssl rand -hex 32)"
          publish_secret PERIAPSIS_S3_ACCESS_KEY "ciapp$(openssl rand -hex 8)"
          publish_secret PERIAPSIS_S3_SECRET_KEY "$(openssl rand -hex 32)"
          publish_secret PERIAPSIS_SMOKE_ADMIN_PASSWORD "$(openssl rand -base64 48)"
          publish_secret PERIAPSIS_WORKER_DATABASE_PASSWORD "$(openssl rand -hex 32)"
          {
            echo "PERIAPSIS_COMPOSE_SECRETS_DIR=${RUNNER_TEMP}/periapsis-compose-secrets"
            echo "PERIAPSIS_DEV_TLS_CA_FILE=${tls_directory}/ca.crt"
            echo "PERIAPSIS_DEV_TLS_CERT_FILE=${tls_directory}/server.crt"
            echo "PERIAPSIS_DEV_TLS_KEY_FILE=${tls_directory}/server.key"
            echo "PERIAPSIS_IDP_ADMIN_USERNAME=admin"
            echo "PERIAPSIS_NOTIFIER_IMAGE=periapsis/notifier:${PERIAPSIS_IMAGE_TAG}"
          } >> "${GITHUB_ENV}"
      - name: Prepare private file-backed Compose secrets
        run: node scripts/deploy/prepare-compose-secrets.mjs
      - name: Validate resolved Compose model
        run: docker compose --file deploy/compose/compose.yaml --profile minimal config --quiet
      - name: Verify TLS and certificate-free proxy Compose models
        run: node --test scripts/deploy/compose-models.test.mjs
      - name: Build application and database images
        run: |
          docker compose --file deploy/compose/compose.yaml --profile auth-test build api worker web edge migration ldap-tls openldap identity-provider minio minio-provision
          docker build \
            --file deploy/images/Dockerfile.notifier \
            --build-arg REVISION="${PERIAPSIS_IMAGE_REVISION}" \
            --build-arg VERSION="${PERIAPSIS_IMAGE_TAG}" \
            --tag "periapsis/notifier:${PERIAPSIS_IMAGE_TAG}" \
            .
      - name: Verify image users and web runtime contents
        run: |
          set -euo pipefail
          docker run --rm --init --user 10001:10001 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --entrypoint caddy \
            "periapsis/edge:${PERIAPSIS_IMAGE_TAG}" version
          api_uid="$(docker run --rm --read-only --tmpfs /tmp:uid=10001,gid=10001,mode=1770 --entrypoint /healthcheck "periapsis/api:${PERIAPSIS_IMAGE_TAG}" --print-uid)"
          worker_uid="$(docker run --rm --read-only --tmpfs /tmp:uid=10001,gid=10001,mode=1770 --entrypoint /healthcheck "periapsis/worker:${PERIAPSIS_IMAGE_TAG}" --print-uid)"
          web_uid="$(docker run --rm --read-only --tmpfs /tmp:uid=10001,gid=10001,mode=1770 --entrypoint node "periapsis/web:${PERIAPSIS_IMAGE_TAG}" -p 'process.getuid()')"
          notifier_uid="$(docker run --rm --read-only --tmpfs /tmp:uid=10001,gid=10001,mode=1770 --entrypoint node "periapsis/notifier:${PERIAPSIS_IMAGE_TAG}" -p 'process.getuid()')"
          database_uid="$(docker run --rm --read-only --tmpfs /tmp:uid=10001,gid=10001,mode=1770 --entrypoint node "periapsis/database-task:${PERIAPSIS_IMAGE_TAG}" -p 'process.getuid()')"
          test "${api_uid}" = "10001"
          test "${worker_uid}" = "10001"
          test "${web_uid}" = "10001"
          test "${notifier_uid}" = "10001"
          test "${database_uid}" = "10001"
          test "$(docker image inspect --format '{{.Config.User}}' "periapsis/api:${PERIAPSIS_IMAGE_TAG}")" = "10001:10001"
          test "$(docker image inspect --format '{{.Config.User}}' "periapsis/worker:${PERIAPSIS_IMAGE_TAG}")" = "10001:10001"
          test "$(docker image inspect --format '{{.Config.User}}' "periapsis/web:${PERIAPSIS_IMAGE_TAG}")" = "10001:10001"
          test "$(docker image inspect --format '{{.Config.User}}' "periapsis/notifier:${PERIAPSIS_IMAGE_TAG}")" = "10001:10001"
          test "$(docker image inspect --format '{{.Config.User}}' "periapsis/database-task:${PERIAPSIS_IMAGE_TAG}")" = "10001:10001"
          docker run --rm --read-only --tmpfs /tmp:uid=10001,gid=10001,mode=1770 --entrypoint node "periapsis/web:${PERIAPSIS_IMAGE_TAG}" -e '
            const { existsSync, readdirSync } = require("node:fs");
            const files = readdirSync("/app/dist-server", { recursive: true }).map(String);
            if (!existsSync("/app/dist-server/index.js") || files.some((file) => file.includes(".test."))) process.exit(1);
          '
      - name: Start hardened minimal stack
        id: minimal-stack-start
        run: docker compose --file deploy/compose/compose.yaml --profile minimal up --detach --no-build
      - name: Wait for service health
        run: |
          set -euo pipefail
          healthy=false
          terminal_failure=false
          for ((attempt = 1; attempt <= 60; attempt++)); do
            healthy=true
            for service in postgres api worker web edge; do
              container="$(docker compose --file deploy/compose/compose.yaml --profile minimal ps --quiet "${service}")"
              if [ -z "${container}" ]; then
                healthy=false
                break
              fi
              status="$(docker inspect --format '{{.State.Health.Status}}' "${container}")"
              if [ "${status}" = "unhealthy" ]; then
                healthy=false
                terminal_failure=true
                break
              fi
              if [ "${status}" != "healthy" ]; then
                healthy=false
              fi
            done
            if [ "${healthy}" = "true" ] || [ "${terminal_failure}" = "true" ]; then
              break
            fi
            sleep 2
          done
          if [ "${healthy}" != "true" ]; then
            exit 1
          fi
          migration_container="$(docker compose --file deploy/compose/compose.yaml --profile minimal ps --all --quiet migration)"
          test -n "${migration_container}"
          test "$(docker inspect --format '{{.State.ExitCode}}' "${migration_container}")" = "0"
          curl --fail --silent --show-error --cacert "${PERIAPSIS_DEV_TLS_CA_FILE}" \
            https://localhost:18081/health/live > /dev/null
      - name: Exercise one-time bootstrap, MFA, sessions, authorization, and tenant selection
        run: |
          NODE_EXTRA_CA_CERTS="${PERIAPSIS_DEV_TLS_CA_FILE}" \
          PERIAPSIS_SMOKE_BASE_URL=https://localhost:18081 \
          node tests/integration/auth-smoke.mjs
      - name: Prove runtime login reprovisioning removes stale memberships
        run: |
          set -euo pipefail
          postgres_container="$(docker compose --file deploy/compose/compose.yaml --profile minimal ps --quiet postgres)"
          test -n "${postgres_container}"
          docker exec -i "${postgres_container}" psql -X -v ON_ERROR_STOP=1 -U postgres -d periapsis <<'SQL'
          GRANT periapsis_migrator TO periapsis_api_login;
          GRANT periapsis_auditor TO periapsis_worker_login;
          SQL
          docker compose --file deploy/compose/compose.yaml --profile minimal run --rm --no-deps migration
          memberships="$(docker exec "${postgres_container}" psql -X -v ON_ERROR_STOP=1 -U postgres -d periapsis -Atc "
            SELECT member_role.rolname || '|' || granted_role.rolname
            FROM pg_catalog.pg_auth_members AS membership
            JOIN pg_catalog.pg_roles AS granted_role
              ON granted_role.oid = membership.roleid
            JOIN pg_catalog.pg_roles AS member_role
              ON member_role.oid = membership.member
            WHERE member_role.rolname IN ('periapsis_api_login', 'periapsis_worker_login')
            ORDER BY member_role.rolname, granted_role.rolname
          ")"
          expected="$(printf '%s\n%s' \
            'periapsis_api_login|periapsis_api' \
            'periapsis_worker_login|periapsis_worker')"
          test "${memberships}" = "${expected}"
      - name: Collect bounded redacted minimal startup diagnostics
        if: ${{ failure() && (steps.minimal-stack-start.outcome == 'failure' || steps.minimal-stack-start.outcome == 'success') }}
        timeout-minutes: 2
        run: node scripts/deploy/compose-startup-diagnostics.mjs
      - name: Stop minimal stack
        if: always()
        run: docker compose --file deploy/compose/compose.yaml --profile minimal down --volumes --remove-orphans
      - name: Validate the composed full acceptance profile
        run: docker compose --file deploy/compose/compose.yaml --profile full config --quiet
      - name: Start fresh API, worker, notifier, Mailpit, edge, OpenLDAP, and Keycloak stack
        id: full-stack-start
        run: docker compose --file deploy/compose/compose.yaml --profile full up --detach --no-build --wait edge openldap identity-provider worker notifier mailpit
      - name: Probe the hardened full acceptance containers and dependencies
        shell: bash
        run: |
          set -euo pipefail
          for service in api worker web notifier edge; do
            container="$(docker compose --file deploy/compose/compose.yaml --profile full ps --quiet "${service}")"
            test -n "${container}"
            test "$(docker inspect --format '{{.State.Health.Status}}' "${container}")" = "healthy"
            test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "${container}")" = "true"
            test "$(docker inspect --format '{{.Config.User}}' "${container}")" = "10001:10001"
          done
          for service in postgres openldap mailpit minio clamav; do
            container="$(docker compose --file deploy/compose/compose.yaml --profile full ps --quiet "${service}")"
            test -n "${container}"
            test "$(docker inspect --format '{{.State.Health.Status}}' "${container}")" = "healthy"
          done
          identity_container="$(docker compose --file deploy/compose/compose.yaml --profile full ps --quiet identity-provider)"
          test -n "${identity_container}"
          test "$(docker inspect --format '{{.State.Health.Status}}' "${identity_container}")" = "healthy"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "${identity_container}")" = "true"
          identity_user="$(docker inspect --format '{{.Config.User}}' "${identity_container}")"
          test -n "${identity_user}"
          [[ "${identity_user}" =~ ^[0-9]+(:[0-9]+)?$ ]]
          test "${identity_user%%:*}" != "0"
          idp_origin="https://idp.localhost:${PERIAPSIS_IDP_PORT:-18090}"
          curl --fail --silent --show-error --cacert "${PERIAPSIS_DEV_TLS_CA_FILE}" \
            "${idp_origin}/realms/periapsis-test/.well-known/openid-configuration" | \
            jq --arg issuer "${idp_origin}/realms/periapsis-test" --exit-status \
              '.issuer == $issuer' > /dev/null
          curl --fail --silent --show-error --cacert "${PERIAPSIS_DEV_TLS_CA_FILE}" \
            https://localhost:18081/health/ready | \
            jq --exit-status '
              .status == "ready" and
              .checks.dfir_object_storage.status == "ready" and
              .checks.dfir_malware_scanner.status == "ready"
            ' > /dev/null
      - name: Export only the ephemeral OpenLDAP public CA
        shell: bash
        run: |
          set -euo pipefail
          ldap_container="$(docker compose --file deploy/compose/compose.yaml --profile full ps --quiet openldap)"
          test -n "${ldap_container}"
          ldap_ca_file="${RUNNER_TEMP}/periapsis-openldap-ca.crt"
          docker cp "${ldap_container}:/run/secrets/ldap/ca.crt" "${ldap_ca_file}"
          chmod 0444 "${ldap_ca_file}"
          echo "PERIAPSIS_LDAP_ACCEPTANCE_CA_FILE=${ldap_ca_file}" >> "${GITHUB_ENV}"
      - name: Exercise composed OpenLDAP and live Phase 3 browser acceptance
        run: |
          NODE_EXTRA_CA_CERTS="${PERIAPSIS_DEV_TLS_CA_FILE}" \
          PERIAPSIS_LDAP_ACCEPTANCE_BASE_URL=https://localhost:18081 \
          PERIAPSIS_LDAP_ACCEPTANCE_COMPOSE_PROFILE=full \
          PERIAPSIS_LDAP_ACCEPTANCE_RUN_LIVE_PLAYWRIGHT=1 \
          node tests/integration/ldap-auth-acceptance.mjs
      - name: Prove the API login cannot mutate append-only tenant audit rows
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="$(docker compose --file deploy/compose/compose.yaml --profile full ps --quiet postgres)"
          test -n "${postgres_container}"
          if PGPASSWORD="${PERIAPSIS_API_DATABASE_PASSWORD}" docker exec -e PGPASSWORD "${postgres_container}" \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U periapsis_api_login -d periapsis \
            -c 'UPDATE public.audit_events SET action = action WHERE false'; then
            echo 'periapsis_api_login unexpectedly updated audit_events' >&2
            exit 1
          fi
          if PGPASSWORD="${PERIAPSIS_API_DATABASE_PASSWORD}" docker exec -e PGPASSWORD "${postgres_container}" \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U periapsis_api_login -d periapsis \
            -c 'DELETE FROM public.audit_events WHERE false'; then
            echo 'periapsis_api_login unexpectedly deleted audit_events' >&2
            exit 1
          fi
      - name: Collect bounded redacted identity-provider startup diagnostics
        if: ${{ failure() && steps.full-stack-start.outcome == 'failure' }}
        timeout-minutes: 1
        run: node scripts/deploy/identity-provider-diagnostics.mjs full
      - name: Collect bounded redacted full startup diagnostics
        if: ${{ failure() && (steps.full-stack-start.outcome == 'failure' || steps.full-stack-start.outcome == 'success') }}
        timeout-minutes: 3
        run: node scripts/deploy/compose-startup-diagnostics.mjs full
      - name: Stop composed full acceptance stack
        if: always()
        run: docker compose --file deploy/compose/compose.yaml --profile full down --volumes --remove-orphans

