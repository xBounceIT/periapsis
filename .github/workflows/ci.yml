    services:
      postgres:
        image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
        env:
          POSTGRES_DB: periapsis
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
          POSTGRES_PASSWORD: periapsis-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d periapsis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install database dependencies
        run: pnpm install --frozen-lockfile --filter @periapsis/db...
      - name: Exercise the real upgrade path
        shell: bash
        env:
          DATABASE_ENV: ${{ matrix.database_env }}
          SECOND_DATABASE_ENV: ${{ matrix.second_database_env }}
          SECOND_DATABASE_NAME: ${{ matrix.second_database_name }}
          POSTGRES_PASSWORD: periapsis-ci-${{ github.run_id }}-${{ github.run_attempt }}
          UPGRADE_DATABASE_URL: postgresql://postgres:periapsis-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/periapsis?sslmode=disable
          UPGRADE_SCRIPT: ${{ matrix.script }}
        run: |
          export "${DATABASE_ENV}=${UPGRADE_DATABASE_URL}"
          if [[ -n "${SECOND_DATABASE_NAME}" ]]; then
            PGPASSWORD="${POSTGRES_PASSWORD}" createdb \
              --host 127.0.0.1 --port 5432 --username postgres \
              "${SECOND_DATABASE_NAME}"
            second_database_url="postgresql://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/${SECOND_DATABASE_NAME}?sslmode=disable"
            export "${SECOND_DATABASE_ENV}=${second_database_url}"
          fi
          pnpm --filter @periapsis/db run "${UPGRADE_SCRIPT}"

