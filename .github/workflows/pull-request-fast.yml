name: Pull request fast checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  javascript:
    name: Fast TypeScript, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Validate integration-driver syntax
        run: |
          node --check deploy/compose/database-task.mjs
          node --check tests/integration/auth-smoke.mjs
          node --check tests/integration/ldap-auth-acceptance.mjs
          sh -n deploy/compose/auth/openldap-acceptance-fixture.sh
      - name: Transpile and enumerate the live browser acceptance
        run: pnpm test:e2e:live:list
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Validate operations and deployment source contracts
        run: pnpm test:operations
      - name: Build
        run: pnpm build

  go:
    name: Fast Go vet and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          check-latest: false
          cache-dependency-path: |
            modules/customfields/go.sum
            modules/dfir/go.sum
            services/api/go.sum
            modules/identity/go.sum
            modules/sla/go.sum
            modules/ticketing/go.sum
            services/worker/go.sum
      - name: Vet
        run: go vet ./modules/contacts/... ./modules/customfields/... ./modules/dfir/... ./modules/identity/... ./modules/sla/... ./modules/ticketing/... ./services/api/... ./services/worker/...
      - name: Vet shell-free healthcheck
        run: go vet ./deploy/compose/healthcheck.go
      - name: Test without the release race detector
        run: go test ./modules/contacts/... ./modules/customfields/... ./modules/dfir/... ./modules/identity/... ./modules/sla/... ./modules/ticketing/... ./services/api/... ./services/worker/...

  generated:
    name: Fast generated and schema drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.22.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          check-latest: false
          cache-dependency-path: |
            modules/customfields/go.sum
            modules/dfir/go.sum
            modules/identity/go.sum
            modules/sla/go.sum
            modules/ticketing/go.sum
            services/api/go.sum
            services/worker/go.sum
      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile
      - name: Verify OpenAPI, clients, and migrations
        run: pnpm verify:generated
      - name: Verify permission catalog
        run: pnpm verify:permission-catalog
      - name: Verify canonical SLA seed documents and kernel behavior
        run: pnpm verify:sla-fixture
      - name: Verify generated Go contract and queries
        run: pnpm verify:go-generated
